plugins {
    id 'com.android.application'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.15'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'be.robinj.rot13'
    compileSdk = 36

    defaultConfig {
        applicationId = "be.robinj.rot13"
        minSdk = 21
        targetSdk = 36
        versionCode = 6
        versionName = "1.3.2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Sign release builds only when a keystore is provided, so local
            // and CI test builds without one still succeed.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true

            all {
                jacoco.includeNoLocationClasses = true
                jacoco.excludes = ['jdk.internal.*']
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Robolectric – runs on the JVM, no emulator needed
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'androidx.test.espresso:espresso-intents:3.7.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def exclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*'
    ]

    // Ask the compile task where it puts its classes rather than hardcoding the
    // intermediates layout, which AGP is free to move between versions.
    classDirectories.setFrom(
        tasks.named('compileDebugJavaWithJavac', JavaCompile)
            .map { fileTree(it.destinationDirectory).matching { exclude exclusions } }
    )
    sourceDirectories.setFrom(files('src/main/java'))
    // project.buildDir was removed in Gradle 9.
    executionData.setFrom(layout.buildDirectory.map { buildDir ->
        fileTree(buildDir) {
            include 'jacoco/testDebugUnitTest.exec'
            include 'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
        }
    })
}
